<div class="h-screen w-fit fixed">
  <div class="w-fit absolute cursor-pointer h-fit p-4">
    <button class="bg-white p-2 items-center rounded-lg shadow-lg" (click)="toggleMenu()">
      <svg *ngIf="!hamburgerIconClicked" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-10">
        <path stroke-linecap="round" stroke-linejoin="round" d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5" />
      </svg>
      <svg *ngIf="hamburgerIconClicked" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#EA3323" class="size-10">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <div class="h-full flex flex-col justify-center">
    <div class="space-y-4 w-fit px-4 flex flex-col">
      <div class="p-0" *ngIf="hamburgerIconClicked || isAnimating" [ngClass]="{'animate-in fade-in zoom-in duration-150': hamburgerIconClicked, 'animate-out fade-out': !hamburgerIconClicked && isAnimating}" (animationend)="onAnimationEnd()">
        <button [routerLink]="['/home']" class="bg-white p-2.5 hover:bg-accent-blue duration-150 rounded-lg shadow-lg" [routerLinkActive]="['activeSideBarNavTap']">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-9">
            <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
          </svg>
        </button>
      </div>

      <div class="p-0" *ngIf="hamburgerIconClicked || isAnimating" [ngClass]="{'animate-in fade-in zoom-in duration-300': hamburgerIconClicked, 'animate-out fade-out': !hamburgerIconClicked && isAnimating}" (animationend)="onAnimationEnd()">
        <button [routerLink]="['/groups']" class="bg-white p-2.5 hover:bg-accent-blue duration-150 rounded-lg shadow-lg" [routerLinkActive]="['activeSideBarNavTap']">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-9">
            <path stroke-linecap="round" stroke-linejoin="round" d="M18 18.72a9.094 9.094 0 0 0 3.741-.479 3 3 0 0 0-4.682-2.72m.94 3.198.001.031c0 .225-.012.447-.037.666A11.944 11.944 0 0 1 12 21c-2.17 0-4.207-.576-5.963-1.584A6.062 6.062 0 0 1 6 18.719m12 0a5.971 5.971 0 0 0-.941-3.197m0 0A5.995 5.995 0 0 0 12 12.75a5.995 5.995 0 0 0-5.058 2.772m0 0a3 3 0 0 0-4.681 2.72 8.986 8.986 0 0 0 3.74.477m.94-3.197a5.971 5.971 0 0 0-.94 3.197M15 6.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Zm6 3a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Zm-13.5 0a2.25 2.25 0 1 1-4.5 0 2.25 2.25 0 0 1 4.5 0Z" />
          </svg>
        </button>
      </div>

      <div class="" *ngIf="hamburgerIconClicked || isAnimating" [ngClass]="{'animate-in fade-in zoom-in duration-500': hamburgerIconClicked, 'animate-out fade-out': !hamburgerIconClicked && isAnimating}" (animationend)="onAnimationEnd()">
        <button [routerLink]="['/settings']" class="bg-white p-2.5 hover:bg-accent-blue duration-150 rounded-lg shadow-lg" [routerLinkActive]="['activeSideBarNavTap']">
          <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-9">
            <path stroke-linecap="round" stroke-linejoin="round" d="M11.42 15.17 17.25 21A2.652 2.652 0 0 0 21 17.25l-5.877-5.877M11.42 15.17l2.496-3.03c.317-.384.74-.626 1.208-.766M11.42 15.17l-4.655 5.653a2.548 2.548 0 1 1-3.586-3.586l6.837-5.63m5.108-.233c.55-.164 1.163-.188 1.743-.14a4.5 4.5 0 0 0 4.486-6.336l-3.276 3.277a3.004 3.004 0 0 1-2.25-2.25l3.276-3.276a4.5 4.5 0 0 0-6.336 4.486c.091 1.076-.071 2.264-.904 2.95l-.102.085m-1.745 1.437L5.909 7.5H4.5L2.25 3.75l1.5-1.5L7.5 4.5v1.409l4.26 4.26m-1.745 1.437 1.745-1.437m6.615 8.206L15.75 15.75M4.867 19.125h.008v.008h-.008v-.008Z" />
          </svg>
        </button>
      </div>

      <div class="p-0" *ngIf="hamburgerIconClicked || isAnimating" [ngClass]="{'animate-in fade-in zoom-in duration-700': hamburgerIconClicked, 'animate-out fade-out': !hamburgerIconClicked && isAnimating}" (animationend)="onAnimationEnd()">
        <button (click)="openDialog()" class="bg-white p-2 hover:bg-accent-blue duration-150 rounded-lg shadow-lg">
          <svg xmlns="http://www.w3.org/2000/svg" height="40px" viewBox="0 -960 960 960" width="40px" fill="#EA3323"><path d="M440-480v-320q0-17 11.5-28.5T480-840q17 0 28.5 11.5T520-800v320q0 17-11.5 28.5T480-440q-17 0-28.5-11.5T440-480Zm40 360q-74 0-139.5-28.5T226-226q-49-49-77.5-114.5T120-480q0-69 25.5-132.5T217-726q11-12 28-12t29 12q11 11 10 27.5T272-669q-34 38-53 86.5T200-480q0 116 82 198t198 82q117 0 198.5-82T760-480q0-54-19-103.5T687-671q-11-12-11.5-28t10.5-27q12-12 29-12t28 12q47 50 72 113.5T840-480q0 74-28.5 139.5t-77 114.5q-48.5 49-114 77.5T480-120Z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
