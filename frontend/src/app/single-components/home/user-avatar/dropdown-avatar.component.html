<div class="flex ml-12 mt-5">
  <div class="flex flex-col justify-center">
    <label class="cursor-pointer" for="fileInput">
      <div *ngIf="url == ''" class="w-fit">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-52">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
        </svg>
      </div>

      <img *ngIf="url != ''" class="h-48 w-48 rounded-full" [src]="url"  alt="user_img"/>
    </label>
    <br />
    <input
      id="fileInput"
      type="file"
      [(ngModel)]="url"
      class="absolute top-0 left-0 z-40 opacity-0 w-fit h-fit cursor-pointer"
      (change)="onSelectFile($event)"
    />
  </div>

  <div class="">
    <button (click)="showOptions()" class="cursor-pointer text-gray-500 hover:text-gray-600 duration-150">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#000000" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM12.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0ZM18.75 12a.75.75 0 1 1-1.5 0 .75.75 0 0 1 1.5 0Z" />
      </svg>
    </button>

    <div class="relative">
      <div *ngIf="showAvatarOptions || isAnimating" [ngClass]="{'animate-fade-down duration-150': showAvatarOptions, 'animate-out fade-out': !showAvatarOptions && isAnimating}" (animationend)="onAnimationEnd()" class="absolute w-fit flex flex-col justify-between h-fit px-2 py-1.5 bg-white border rounded-lg shadow-md ">
        <button class="w-full flex px-1 py-1.5 space-x-1 bg-white rounded-lg text-start hover:bg-accent-blue ease-in-out duration-150" (click)="triggerFileInput()">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#8087FD"><path d="M440-440H240q-17 0-28.5-11.5T200-480q0-17 11.5-28.5T240-520h200v-200q0-17 11.5-28.5T480-760q17 0 28.5 11.5T520-720v200h200q17 0 28.5 11.5T760-480q0 17-11.5 28.5T720-440H520v200q0 17-11.5 28.5T480-200q-17 0-28.5-11.5T440-240v-200Z"/></svg>
          <h1>{{'home.avatar.add' | translate}}</h1>
        </button>

        <button class="w-full flex px-1 py-1.5 space-x-1 bg-white rounded-lg text-start hover:bg-accent-blue ease-in-out duration-150" (click)="deleteAvatar()">
          <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#EA3323"><path d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z"/></svg>
          <h1>{{'home.avatar.remove' | translate}}</h1>
        </button>
      </div>
    </div>
  </div>
</div>
