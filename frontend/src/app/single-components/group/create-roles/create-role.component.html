<div class="relative">

  <!-- Roles Button -->
  <!-- Flex-Container: Roles Button + Popup -->
    <!-- Roles Button -->
    <Button
      class="flex bg-white hover:bg-gray-50 cursor-pointer duration-150 ease-in-out rounded-lg shadow-md px-4 py-2 space-x-2 items-center"
      (click)="toggleDropdown()">
      <h1 class="text-lg font-semibold">
        {{ 'groups.createdGroup.rolesBtn.btnTitle' | translate }}
      </h1>
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#8087FD" class="w-6 h-6">
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M9.568 3H5.25A2.25 2.25 0 0 0 3 5.25v4.318c0 .597.237 1.17.659 1.591l9.581 9.581c.699.699 1.78.872 2.607.33a18.095 18.095 0 0 0 5.223-5.223c.542-.827.369-1.908-.33-2.607L11.16 3.66A2.25 2.25 0 0 0 9.568 3Z" />
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 6h.008v.008H6V6Z" />
      </svg>
    </Button>




  <!-- Create Roles Dropdown -->
  <div *ngIf="isOpen || isAnimating" [ngClass]="{'animate-fade-down duration-150': isOpen, 'animate-out fade-out': !isOpen && isAnimating}" (animationend)="onAnimationEnd()" class="absolute">
    <div class="mb-1 p-2 flex bg-white rounded-lg shadow-lg mt-2 items-center space-x-2">
      <div class="py-0.5 pl-0.5 pr-1">
        <input [(ngModel)]="newRoleInput" (keyup.enter)="addRole()" class="w-44 rounded-md border p-1" type="text" placeholder="{{'groups.createdGroup.rolesBtn.placeholder' | translate}}">
      </div>

      <button (click)="addRole()" class="p-0.5 bg-white rounded-md hover:shadow-md ease-in-out duration-150 cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#8087FD" class="size-6">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.5v15m7.5-7.5h-15" />
        </svg>
      </button>
    </div>

    <div [ngClass]="isListEmpty">
      <div class="flex flex-col space-y-2 p-1.5">
        <div class="" *ngFor="let currRole of TESTrolesService.groupRoles; index as i">
          <div class="flex justify-between items-center p-2">
            <h1 class="text-left text-gray-500 flex-1">{{ currRole }}</h1>
            <div class="space-x-2">
              <button (click)="giveMemberRole(currRole)" class="p-0.5 bg-white rounded-md hover:shadow-md ease-in-out duration-150 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="M17.982 18.725A7.488 7.488 0 0 0 12 15.75a7.488 7.488 0 0 0-5.982 2.975m11.963 0a9 9 0 1 0-11.963 0m11.963 0A8.966 8.966 0 0 1 12 21a8.966 8.966 0 0 1-5.982-2.275M15 9.75a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z" />
                </svg>
              </button>

              <button (click)="removeRoleFromList(i)" class="p-0.5 bg-white rounded-md hover:shadow-md ease-in-out duration-150 cursor-pointer">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#EA3323" class="size-6">
                  <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                </svg>
              </button>
            </div>
          </div>

          <div *ngIf="i < createdRoles.length - 1" class="w-full flex justify-center">
            <hr class="w-6 border-t border-gray-300">
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
