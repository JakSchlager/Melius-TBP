

<!-- Loading Screen, so all the data can load correctly -->

<div *ngIf="isLoading"
     class="z-50 fixed inset-0 flex items-center justify-center bg-white transition-opacity duration-500 ease-out"
     [ngClass]="{ 'opacity-0': fadeOut }">

  <div class="text-xl flex flex-col items-center">
    <!-- Pulsierendes Logo -->
    <img src="assets/Melius-TBP_Logo_Simple.svg"
         alt="melius_logo"
         class="min-w-40 min-h-40 w-48 h-48 mb-4 animate-pulse-slow">
    <div class="w-10 h-10 border-8 border-t-transparent border-black rounded-full animate-spin"></div>

  </div>

</div>



<div  class="relative w-full min-h-screen flex justify-center">

  <!-- Aktualisierter Hintergrund -->
  <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10">
    <!-- Ebene für die Hintergrundfarbe (ohne Blur) -->
    <!--<div class="absolute inset-0" [ngStyle]="{'background-color': newBackgroundColor ? newBackgroundColor : '#f9fafb'}"></div>-->

    <!-- Ebene für das Hintergrundbild (mit Blur) -->
    <div class="bg-fixed h-screen transition-opacity duration-1000 ease-in-out absolute inset-0 blur-xl scale-110" [ngStyle]="{'background': newBackgroundImageUrl ? 'url(' + newBackgroundImageUrl + ')' : newBackgroundColor,
        'background-size': 'cover',
        'background-position': 'center',
        'background-repeat': 'no-repeat',
      }" [ngClass]="{ 'opacity-0': isLoading, 'opacity-100': !isLoading }">
    </div>
  </div>


  <div class="w-5/6">

    <!-- Outer wrapper with one gradient “border” -->
    <div class="w-full mb-10 mt-4 h-fit p-[4px] bg-gradient-to-r from-[#0D91FA] via-[#8087FD] to-[#5E4DFC] rounded-2xl">
      <!-- Inner white box -->
      <div class="bg-white shadow-lg rounded-xl w-full">

        <!-- Header content -->
        <div class="py-4 flex flex-col md:flex-row items-center justify-between">
          <div class="w-2/3 h-full flex items-center">
            <div class="h-max flex flex-col justify-center">
              <app-dropdown-avatar></app-dropdown-avatar>
            </div>

            <div class="flex flex-col justify-center space-y-2">
              <h1 class="text-6xl font-bold">{{'home.header' | translate}}</h1>
              <h1 class="text-5xl">
                {{profileService.loggedInUser?.firstName}} {{profileService.loggedInUser?.lastName}}
              </h1>
            </div>
          </div>

          <div class="hidden sm:hidden md:hidden lg:flex w-1/3 mr-20 justify-end">
            <img src="assets/Melius-TBP_Logo_Simple.svg" alt="melius_logo" class="min-w-40 min-h-40 w-48 h-48">
          </div>
        </div>

        <!-- Navbar inside the same box, optionally still sticky -->
        <div class="sticky top-0 z-10 w-full">
          <app-home-navbar></app-home-navbar>
        </div>

      </div>
    </div>



    <div class="flex flex-col">
      <div *ngIf="!isChildRoute" class=" justify-between grid grid-cols-1 xl:grid-cols-3 mt-20 gap-x-10">
        <div class="w-full py-10 flex flex-col justify-center bg-white shadow-lg col-start-1 rounded-lg animate-in fade-in zoom-in duration-500 hover:scale-105 hover:bg-blue-50 transition-duration-150" [routerLink]="['/home/cv']">
          <div class="py-4 flex justify-center">
            <img ngSrc="assets/icons/home-page/profile.svg" alt="home_cv_icon" class="w-60 h-60 " height="16" width="16">
          </div>
          <div class="">
            <h1 class="text-center text-2xl font-bold text-gray-700">{{'home.start.landingBoxCV' | translate}}</h1>
          </div>
        </div>

        <div class="w-full py-10 flex flex-col justify-center bg-white shadow-lg col-start-2 rounded-lg animate-in fade-in zoom-in duration-700 hover:scale-105 hover:bg-violet-100 transition-duration-150" [routerLink]="['/home/projects']">
          <div class="py-4 flex justify-center">
            <img ngSrc="assets/icons/home-page/projects.svg" alt="home_cv_icon" class="w-60 h-60 " height="16"
                 width="16">
          </div>

          <div>
            <h1 class="text-center text-2xl font-bold text-gray-700">{{'home.start.landingBoxProjects' | translate}}</h1>
          </div>
        </div>

        <div class="w-full py-10 flex flex-col justify-center bg-white shadow-lg col-start-3 rounded-lg animate-in fade-in zoom-in duration-1000 hover:scale-105 hover:bg-indigo-100 transition-duration-150" [routerLink]="['/home/strengths']">
          <div class="py-4 flex justify-center">
            <img ngSrc="assets/icons/home-page/skills.svg" alt="home_cv_icon" class="w-60 h-60 " height="16" width="16">
          </div>

          <div class="">
            <h1 class="text-center text-2xl font-bold text-gray-700">{{'home.start.landingBoxComp' | translate}}</h1>
          </div>
        </div>
      </div>

      <div class="w-full h-full">
        <router-outlet></router-outlet>
      </div>
    </div>

    <!-- Here should the Button be-->
    <button class="fixed bottom-6 right-6 bg-primary-color hover:bg-blue-500 text-white p-4 rounded-full shadow-lg transition duration-200 flex items-center justify-center"
            (click)="exportData('/portfolio/'+profileService.loggedInUser?.id)" routerLink="/portfolio/{{profileService.loggedInUser?.id}}" target="blank">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
        <path stroke-linecap="round" stroke-linejoin="round" d="M15.59 14.37a6 6 0 0 1-5.84 7.38v-4.8m5.84-2.58a14.98 14.98 0 0 0 6.16-12.12A14.98 14.98 0 0 0 9.631 8.41m5.96 5.96a14.926 14.926 0 0 1-5.841 2.58m-.119-8.54a6 6 0 0 0-7.381 5.84h4.8m2.581-5.84a14.927 14.927 0 0 0-2.58 5.84m2.699 2.7c-.103.021-.207.041-.311.06a15.09 15.09 0 0 1-2.448-2.448 14.9 14.9 0 0 1 .06-.312m-2.24 2.39a4.493 4.493 0 0 0-1.757 4.306 4.493 4.493 0 0 0 4.306-1.758M16.5 9a1.5 1.5 0 1 1-3 0 1.5 1.5 0 0 1 3 0Z" />
      </svg>
    </button>

    <!-- footer -->

    <div class="w-full flex justify-center mt-16 py-10">
      <div class="flex items-center space-x-2 h-fit">
        <small class="text-gray-500">All rights reserved to ©Melius-TBP.</small>
        <img class="w-6 h-6" src="assets/Melius-TBP_Logo_Simple.svg" alt="melius_logo" >
      </div>
    </div>
  </div>


</div>
