<div class="relative w-full min-h-screen flex justify-center">

  <!-- Aktualisierter Hintergrund -->
  <div class="fixed top-0 left-0 w-full h-full overflow-hidden -z-10 blur-2xl" [ngStyle]="{'background-color': newBackgroundImageUrl ? 'white' : newBackgroundColor,
                'background-image': newBackgroundImageUrl ? 'url(' + newBackgroundImageUrl + ')' : 'url(assets/melius_default-wallpaper2.png)',
                'background-size': 'cover', 'background-position': 'center', 'background-repeat': 'no-repeat', 'background-attachment': 'fixed', 'overflow': 'auto'}">
  </div>

  <div class="w-5/6">

    <!-- Outer wrapper with one gradient “border” -->
    <div class="w-full mb-10 mt-4 h-fit p-[4px] bg-gradient-to-r from-[#0D91FA] via-[#8087FD] to-[#5E4DFC] rounded-2xl">
      <!-- Inner white box -->
      <div class="bg-white shadow-lg rounded-xl w-full">

        <!-- Header content -->
        <div class="py-4 flex items-center justify-between">
          <div class="w-2/3 h-full flex items-center">
            <div class="h-max flex flex-col justify-center">
              <app-dropdown-avatar></app-dropdown-avatar>
            </div>

            <div class="flex flex-col justify-center space-y-2">
              <h1 class="text-6xl font-bold">{{'home.header' | translate}}</h1>
              <h1 class="text-5xl">
                {{profileService.loggedInUser?.firstName}} {{profileService.loggedInUser?.lastName}}
              </h1>
            </div>
          </div>

          <div class="w-1/3 mr-20 relative flex justify-end">
            <div class="h-full flex flex-col justify-center">
              <img
                src="assets/Melius-TBP_Logo_Simple.svg"
                alt="melius_logo"
                class="min-w-40 min-h-40 w-48 h-48"
              >
            </div>
          </div>
        </div>

        <!-- Navbar inside the same box, optionally still sticky -->
        <div class="sticky top-0 z-10 w-full">
          <app-home-navbar></app-home-navbar>
        </div>

      </div>
    </div>

    <div class="flex flex-col">
      <div *ngIf="!isChildRoute" class="flex space-x-8 justify-between columns-3 mt-10">
        <div class="w-full py-10 flex flex-col justify-center bg-white shadow-custom-shadow border-4 border-primary-color rounded-lg animate-in fade-in zoom-in duration-500 hover:-translate-y-2 hover:bg-gray-100 transition-duration-150" [routerLink]="['/home/cv']">
          <div class="py-4 flex justify-center">
            <img ngSrc="assets/icons/home-page/profile.svg" alt="home_cv_icon" class="w-60 h-60 " height="16" width="16">
          </div>
          <div class="">
            <h1 class="text-center text-2xl font-bold">{{'home.start.landingBoxCV' | translate}}</h1>
          </div>
        </div>

        <div class="w-full py-10 flex flex-col justify-center bg-white shadow-custom-shadow border-4 border-intermediate-color rounded-lg animate-in fade-in zoom-in duration-700 hover:-translate-y-2 hover:bg-gray-100 transition-duration-150" [routerLink]="['/home/projects']">
          <div class="py-4 flex justify-center">
            <img ngSrc="assets/icons/home-page/projects.svg" alt="home_cv_icon" class="w-60 h-60 " height="16"
                 width="16">
          </div>

          <div>
            <h1 class="text-center text-2xl font-bold ">{{'home.start.landingBoxProjects' | translate}}</h1>
          </div>
        </div>

        <div class="w-full py-10 flex flex-col justify-center bg-white shadow-custom-shadow border-4 border-secondary-color rounded-lg animate-in fade-in zoom-in duration-1000 hover:-translate-y-2 hover:bg-gray-100 transition-duration-150" [routerLink]="['/home/strengths']">
          <div class="py-4 flex justify-center">
            <img ngSrc="assets/icons/home-page/skills.svg" alt="home_cv_icon" class="w-60 h-60 " height="16" width="16">
          </div>

          <div class="">
            <h1 class="text-center text-2xl font-bold ">{{'home.start.landingBoxComp' | translate}}</h1>
          </div>
        </div>
      </div>

      <div class="w-full h-full pb-10">
        <router-outlet></router-outlet>
      </div>
    </div>
  </div>


</div>
