<div class="w-screen h-screen flex justify-center">
  <!-- Background Image -->
  <div class="absolute -z-10 w-screen h-screen overflow-hidden bg-no-repeat object-fill">
    <img ngSrc="../../../../assets/Melius-Groups-Background.svg" alt="radio_waves" class="min-w-max min-h-max opacity-10 object-contain bg-no-repeat overflow-hidden" height="16"
         width="16">
  </div>


  <div class="w-5/6">
    <!-- Header -->
    <div class="w-full h-1/4 mt-6 p-10">
      <div class="flex justify-between items-center">
        <div class="flex space-x-10 items-center">
          <div>
            <app-group-avatar></app-group-avatar>
          </div>

          <div class="space-y-3 items-center mb-6">
            <h1 class="text-6xl font-bold">Willkommen zu</h1>
            <h1 class="text-5xl font-bold">Group name</h1>
          </div>
        </div>

        <div class="h-fit w-fit">
          <div class="space-y-4 bg-white py-4 px-4 rounded-xl drop-shadow-lg border border-gray-100">
            <!-- Informations about the group -->
            <div class="mx-5 space-y-5">
              <div class="flex justify-between">
                <div>
                  <h1 class="text-2xl font-semibold">Unternehmen</h1>
                  <h1 class="font-semibold text-lg">Name</h1>
                </div>
                <div>
                  <h1 class="text-2xl font-semibold">Abteilung</h1>
                  <h1 class="font-semibold text-lg">Name</h1>
                </div>
              </div>


              <div class="">
                <h1 class="text-2xl font-semibold">Mitglieder</h1>
                  <div class="flex justify-between space-x-8">
                    <div>
                      <h1 class="font-semibold text-lg">Zurzeit beigetreten</h1>
                      <h1 class="font-semibold text-md">Anzahl</h1>
                    </div>
                    <div>
                      <h1 class="font-semibold text-lg">Max. zulässig</h1>
                      <h1 class="font-semibold text-md">Anzahl</h1>
                    </div>
                  </div>
              </div>
            </div>
            <div class="w-full flex justify-center">
              <button class="bg-intermediate-color text-white px-2.5 py-1.5 rounded-lg hover:bg-secondary-color duration-150 ease-in-out">Änderungen Speichern</button>
            </div>
          </div>

          <!-- DropDown Menu Buttons -->
          <div class="flex justify-evenly mt-2">
            <div>
              <!-- Filter Members DropDown -->
              <app-filter-members></app-filter-members>
            </div>
            <div>
              <!-- Create Roles DropDown -->
              <app-create-roles></app-create-roles>
            </div>
          </div>
        </div>

      </div>
    </div>


    <!-- Main Content (Display Members with their Roles )-->
    <div class="w-full ">
      <div class="py-24 space-y-4 text-center mt-20" *ngIf="myGroupService.getAllMembers() == 0">
        <h1 class="font-semibold text-2xl">Derzeit gibt es noch <strong class="text-intermediate-color">keine</strong> Mitglieder.</h1>
        <div class="w-full flex justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" height="50px" viewBox="0 -960 960 960" width="50px" fill="#000000"><path d="M640-600q8 0 14-6t6-14v-120q0-8-6-14t-14-6q-8 0-14 6t-6 14v120q0 8 6 14t14 6Zm0 80q8 0 14-6t6-14q0-8-6-14t-14-6q-8 0-14 6t-6 14q0 8 6 14t14 6ZM160-160q-17 0-28.5-11.5T120-200q0-17 11.5-28.5T160-240h400q17 0 28.5 11.5T600-200q0 17-11.5 28.5T560-160H160Zm480-280q-83 0-141.5-58.5T440-640q0-83 58.5-141.5T640-840q83 0 141.5 58.5T840-640q0 83-58.5 141.5T640-440Zm-480-40q-17 0-28.5-11.5T120-520q0-17 11.5-28.5T160-560h187q17 0 28.5 11.5T387-520q0 16-11.5 28T347-480H160Zm0 160q-17 0-28.5-11.5T120-360q0-17 11.5-28.5T160-400h317q17 0 28.5 11.5T517-360q0 16-11 28t-29 12H160Z"/></svg>
        </div>
      </div>
    </div>
  </div>
</div>
