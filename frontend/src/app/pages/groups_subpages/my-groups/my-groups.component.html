<div class="w-full h-full flex flex-col justify-center">
  <div class="h-fit w-full pt-4 pb-6 px-2 bg-white shadow-lg rounded-lg">
    <div class="relative flex items-center pt-1 pb-4">
      <div class="w-full flex justify-center">
        <h1 class="w-fit text-3xl font-bold py-2">{{ 'groups.startPage.myGroups.boxTitle' | translate}}</h1>
      </div>

      <div class="w-full py-2 flex justify-end absolute -ml-2">
        <button class="w-fit" (click)="closeMyGroupsForm()">
          <svg xmlns="http://www.w3.org/2000/svg" height="34px" width="34px" class="text-gray-400 cursor-pointer" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
          </svg>
        </button>
      </div>
    </div>

    <!-- Search Bar for filtering User Groups -->
    <div class="w-full ml-4 h-fit flex justify-start">
      <div class="w-fit h-fit font-semibold bg-white px-1 py-0.5 shadow-md rounded-lg flex">
        <input class="" placeholder="{{ 'groups.startPage.myGroups.searchBarSmall' | translate}}">
        <button>
          <svg xmlns="http://www.w3.org/2000/svg" height="38px" viewBox="0 -960 960 960" width="38px" fill="#CECECE"><path d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z"/></svg>
        </button>
      </div>
    </div>

    <!-- Main Content -->
    <div class="w-full h-full">
      <div class="py-24 space-y-4 text-center" *ngIf="getAmountOfGroups() == 0">
        <h1 class="font-semibold text-xl">{{ 'groups.startPage.myGroups.nothingFound' | translate}}</h1>
        <div class="w-full flex justify-center">
          <svg xmlns="http://www.w3.org/2000/svg" height="64px" viewBox="0 -960 960 960" width="64px" fill="#000000"><path d="M640-600q8 0 14-6t6-14v-120q0-8-6-14t-14-6q-8 0-14 6t-6 14v120q0 8 6 14t14 6Zm0 80q8 0 14-6t6-14q0-8-6-14t-14-6q-8 0-14 6t-6 14q0 8 6 14t14 6ZM160-160q-17 0-28.5-11.5T120-200q0-17 11.5-28.5T160-240h400q17 0 28.5 11.5T600-200q0 17-11.5 28.5T560-160H160Zm480-280q-83 0-141.5-58.5T440-640q0-83 58.5-141.5T640-840q83 0 141.5 58.5T840-640q0 83-58.5 141.5T640-440Zm-480-40q-17 0-28.5-11.5T120-520q0-17 11.5-28.5T160-560h187q17 0 28.5 11.5T387-520q0 16-11.5 28T347-480H160Zm0 160q-17 0-28.5-11.5T120-360q0-17 11.5-28.5T160-400h317q17 0 28.5 11.5T517-360q0 16-11 28t-29 12H160Z"/></svg>
        </div>
      </div>
    </div>
  </div>

</div>
