<div class="w-full animate-in slide-in-from-bottom-32 duration-500">

  <div class="w-full flex flex-col items-center">
    <h1 [ngClass]="showGhTitle" class="text-center font-bold text-3xl py-2 my-5">{{'home.projectsPage.ghProjects.title' | translate}}</h1>

    <!-- TODO: remove gh Projects Button überarbeiten -->
    <button [ngClass]="buttonClass" (click)="deleteGithubUser()" class="bg-white hover:bg-gray-100 ease-in-out duration-150 rounded-2xl border-2 text-red-500 text-lg border-red-500 px-4 py-2">
      Remove User
    </button>

    <div id="ghUserForm" [formGroup]="ghUserForm" class=" my-10 box-content rounded-lg bg-white shadow-custom-shadow md:mt-0 sm:max-w-md xl:p-20 xl:py-10 flex flex-col justify-evenly items-center">
      <h1 class="text-3xl mb-5 font-bold leading-tight tracking-tight bg-gradient-to-r from-primary-color to-secondary-color inline-block text-transparent bg-clip-text">
        {{'home.projectsPage.ghProjects.showRepoTxt' | translate}}
      </h1>

      <input type="text" placeholder="{{'home.projectsPage.ghProjects.inputGhName' | translate}}" formControlName="username" class="w-3/4 my-5 bg-accent-blue border border-gray-300 text-gray-900 rounded-lg focus:ring-primary-600 focus:border-primary-600 block p-2.5" [required]="true">
      <button class="w-1/3 font-bold bg-primary-color text-accent-blue focus:ring-4 focus:outline-none focus:ring-primary-300 rounded-lg text-sm px-5 py-2.5 text-center hover:bg-blue-500 duration-150 ease-in-out" (click)="getRepos(ghUserForm.controls['username']!.value!)">{{'home.projectsPage.ghProjects.confirmBtn' | translate}}</button>
    </div>

    <div id="repo-box" class="mt-10 w-full grid grid-cols-3 gap-5"></div>
  </div>

  <div class="w-full flex flex-col items-center mt-10">
    <div class="w-2/5">
      <h1 class="text-center font-bold text-3xl py-2 my-5">{{'home.projectsPage.artworks.title' | translate}}</h1>


      <div class="bg-white border border-dashed border-gray-400 rounded-lg shadow-lg hover:bg-accent-blue ease-in-out duration-150">
        <input
          type="file"
          (change)="onFileSelected($event)"
          multiple
          class="hidden"
          id="fileUpload"
          accept=".jpeg, .png, .pdf, .jpg"
        />
        <label
          for="fileUpload"
          class="w-full h-full py-12 flex items-center justify-center cursor-pointer">
          <span class="text-gray-500">{{'home.projectsPage.artworks.uploadBtn' | translate}}</span>
        </label>
      </div>

      <div class="">
        <div *ngIf="selectedFiles.length > 0" class="mt-4">
          <div *ngFor="let file of selectedFiles; let i = index" class="flex items-center justify-between bg-gray-100 p-2 rounded mb-2">
            <div class="min-w-96 w-fit flex items-center space-x-10">
              <div class="w-10 h-10 bg-gray-300 rounded overflow-hidden">
                <img [src]="file.url" alt="preview" class="object-cover w-full h-full"/>
                <span *ngIf="isPdf(file.url)" class="text-gray-500 text-sm">PDF</span>
              </div>
              <span>{{ file.name }}</span>
            </div>
            <button (click)="removeFile(i)" class="text-red-500 hover:text-red-700">
              <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#EA3323" class="size-6">
                <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
              </svg>
            </button>
          </div>
        </div>

        <div class="w-full flex justify-center py-2.5">
          <button *ngIf="selectedFiles.length > 0" (click)="uploadFiles()" class="flex items-center font-bold bg-primary-color text-white rounded-lg text-sm px-5 py-2.5 text-center gap-x-2 hover:bg-blue-500 duration-150 ease-in-out">
            <h1>Hochladen</h1>
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#FFFFFF"><path d="M440-320v-326L336-542l-56-58 200-200 200 200-56 58-104-104v326h-80ZM240-160q-33 0-56.5-23.5T160-240v-120h80v120h480v-120h80v120q0 33-23.5 56.5T720-160H240Z"/></svg>
          </button>
        </div>
      </div>
    </div>

    <div class="w-full">
      <div *ngIf="uploadBtnClicked && uploadedFiles != undefined" class="relative top-0 w-full mt-6 h-fit ">
        <div class="grid grid-cols-4 space-x-4">

          <!-- File Column One -->
          <div class="col-start-1 border-2 border-dashed border-gray-100  rounded-lg space-y-10" id="firstFileProjectCol"
               (dragover)="onDragOver($event)"
               (drop)="onDrop($event, 'firstFileProjectCol')">

            <div *ngFor="let uploadedFile of uploadedFiles; let i = index" draggable="true" (dragstart)="onDragStart($event, $event.target)" id="{{uploadedFile.id}}" class="bg-transparent p-2 animate-in fade-in zoom-in duration-700 flex flex-col w-fit h-fit overflow-hidden">
              <div class="w-fit h-fit">
                <div class="w-full h-full flex justify-between items-center">
                  <div class="bg-white p-1 rounded-lg shadow-lg cursor-grab" (mouseenter)="allowDrag = true" (mouseleave)="allowDrag = false">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="size-6">
                      <path stroke-linecap="round" stroke-linejoin="round" d="M7.864 4.243A7.5 7.5 0 0 1 19.5 10.5c0 2.92-.556 5.709-1.568 8.268M5.742 6.364A7.465 7.465 0 0 0 4.5 10.5a7.464 7.464 0 0 1-1.15 3.993m1.989 3.559A11.209 11.209 0 0 0 8.25 10.5a3.75 3.75 0 1 1 7.5 0c0 .527-.021 1.049-.064 1.565M12 10.5a14.94 14.94 0 0 1-3.6 9.75m6.633-4.596a18.666 18.666 0 0 1-2.485 5.33" />
                    </svg>
                  </div>
                  <button draggable="false" class="bg-white p-1 rounded-lg shadow-lg w-fit hover:bg-gray-100 duration-150 ease-in-out" (click)="removeSpecificFile(uploadedFile.id)">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="#EA3323" class="size-6">
                      <path stroke-linecap="round" stroke-linejoin="round" d="m14.74 9-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 0 1-2.244 2.077H8.084a2.25 2.25 0 0 1-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 0 0-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 0 1 3.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 0 0-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 0 0-7.5 0" />
                    </svg>
                  </button>
                </div>
                <div class="py-2" draggable="false">
                  <img [src]="this.imageService.getDecodedImage(uploadedFile.image)" alt="uploaded_file" class="rounded-lg shadow-lg"/>
                </div>
              </div>
            </div>
          </div>


          <!-- File Column Two -->
          <div class="col-start-2 border-2 border-dashed border-gray-100  rounded-lg space-y-10" id="secondFileProjectCol"
               (dragover)="onDragOver($event)"
               (drop)="onDrop($event, 'secondFileProjectCol')">
          </div>


            <!-- File Column Three -->
          <div class="col-start-3 border-2 border-dashed border-gray-100  rounded-lg space-y-10" id="thirdFileProjectCol"
               (dragover)="onDragOver($event)"
               (drop)="onDrop($event, 'thirdFileProjectCol')">
          </div>


          <!-- File Column Four -->
          <div class="col-start-4 border-2 border-dashed border-gray-100  rounded-lg space-y-10" id="fourthFileProjectCol"
               (dragover)="onDragOver($event)"
               (drop)="onDrop($event, 'fourthFileProjectCol')">
          </div>
          </div>
        </div>
    </div>

  </div>
</div>
